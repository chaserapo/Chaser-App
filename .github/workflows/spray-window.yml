name: Spray Window (daily marketing site)

# Rebuilds the free "Can I spray today?" site with fresh forecasts, deploys it
# to its own Vercel project ("chaser-spray-window"), and (morning run only)
# posts the daily cards to Facebook. The Chaser website's vercel.json proxies
# <domain>/spray/* to that project.
#
# Required secret: VERCEL_TOKEN. Optional repo variables: SITE_URL, BASE_PATH,
# VERCEL_SCOPE, APP_STORE_URL, PLAY_STORE_URL, CHASER_SITE_URL.
# Optional secrets: OPEN_METEO_API_KEY, ANTHROPIC_API_KEY, FB_PAGE_ID, FB_PAGE_TOKEN.

on:
  schedule:
    - cron: "30 19 * * *" # 5:30am AEST / 6:30am AEDT: morning build + social post
    - cron: "0 2 * * *" # 12pm AEST: midday forecast refresh, no post
  workflow_dispatch:
    inputs:
      post_to_facebook:
        description: "Post today's cards to the Facebook Page after deploying"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spray-window
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL }}
  BASE_PATH: ${{ vars.BASE_PATH }}
  APP_STORE_URL: ${{ vars.APP_STORE_URL }}
  PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
  CHASER_SITE_URL: ${{ vars.CHASER_SITE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: marketing/spray-window
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/spray-window/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Check town coordinates (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run check-towns

      - name: Build site from live forecasts
        run: npm run build
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}

      - name: Render social cards and captions
        run: npm run social
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: social-kit
          path: marketing/spray-window/dist/${{ vars.BASE_PATH || 'spray' }}/social
          retention-days: 14

      # The folder name becomes the Vercel project name: the first deploy
      # creates "chaser-spray-window", later deploys reuse it.
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          rm -rf ../chaser-spray-window && cp -r dist ../chaser-spray-window
          npx --yes vercel@latest deploy ../chaser-spray-window --prod --yes \
            --token "$VERCEL_TOKEN" ${VERCEL_SCOPE:+--scope "$VERCEL_SCOPE"}
        env:
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}

  post-facebook:
    needs: build
    if: github.event.schedule == '30 19 * * *' || inputs.post_to_facebook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing/spray-window
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: social-kit
          path: marketing/spray-window/dist/${{ vars.BASE_PATH || 'spray' }}/social

      - name: Post to Facebook Page
        run: node src/post-facebook.mjs
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
