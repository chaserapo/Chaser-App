name: EAS Build (iOS Production)

# Manual trigger only — click "Run workflow" on this workflow's page in the
# GitHub Actions tab. Never runs automatically on push, so it can't consume
# a build unexpectedly.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Now waits for the actual EAS build (was --no-wait) so this run's log
    # streams live progress instead of just confirming the submit — cap it
    # so a stuck build on EAS's side doesn't leave this job hanging.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install eas-cli
        run: npm install --global eas-cli

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile production --non-interactive
